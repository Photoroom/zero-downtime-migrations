# Pre-commit hooks for zero-downtime-migrations
# See https://pre-commit.com for more information

- id: zdm
  name: Zero-Downtime Migrations Linter
  description: Check Django migrations for PostgreSQL safety issues
  entry: zdm
  language: python
  types: [python]
  files: .*/migrations/.*\.py$
  exclude: __init__\.py$

- id: zdm-diff
  name: Zero-Downtime Migrations Linter (diff mode)
  description: Check changed Django migrations for PostgreSQL safety issues
  entry: zdm --diff-staged origin/main
  language: python
  pass_filenames: false
  always_run: true

- id: zdm-rust
  name: Zero-Downtime Migrations Linter (built from source)
  description: Check Django migrations for PostgreSQL safety issues (auto-builds via cargo install)
  entry: zdm
  language: rust
  types: [python]
  files: .*/migrations/.*\.py$
  exclude: __init__\.py$
