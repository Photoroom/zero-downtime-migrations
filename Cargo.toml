[package]
name = "zero-downtime-migrations"
version = "0.3.2"
edition = "2021"
description = "A PostgreSQL migration safety linter for Django"
license = "MIT"
repository = "https://github.com/Photoroom/zero-downtime-migrations"
readme = "README.md"
keywords = ["django", "postgresql", "migrations", "linter", "database"]
categories = ["command-line-utilities", "development-tools"]
default-run = "zdm"

[[bin]]
name = "zdm"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
colored = "2"

# Parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# File discovery
walkdir = "2"
glob = "0.3"

# Error handling & diagnostics
thiserror = "1"

# Git integration (vendored-openssl for cross-compilation)
git2 = { version = "0.21", features = ["vendored-openssl"] }

# Output
serde_json = "1"

# Unix-only: `geteuid` for the config walk-up's anchor-trust check.
# See `src/config/mod.rs::anchor_dir_is_trusted` — rejects a `.git`
# ancestor owned by an arbitrary other user (e.g. one planted in
# world-writable `/tmp` with sticky bit).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
